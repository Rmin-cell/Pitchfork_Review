<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitchfork High-Scoring Albums</title>
    
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #ffa8b6 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .app {
            min-height: 100vh;
            padding-bottom: 2rem;
        }
        
        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem 0;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.95;
        }
        
        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #e91e63;
            margin-bottom: 0.25rem;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }
        
        /* Controls */
        .controls {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(233, 30, 99, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 160px;
            justify-content: center;
        }
        
        .refresh-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(233, 30, 99, 0.4);
        }
        
        .refresh-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 0;
            color: white;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Albums Grid */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        /* Album Card */
        .album-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .album-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e91e63, #f06292, #f8bbd9);
        }
        
        .album-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        .album-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            padding-right: 2rem;
        }
        
        .album-artist {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }
        
        .album-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        /* Chips */
        .chip {
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
            transition: all 0.2s ease;
        }
        
        .chip:hover {
            transform: scale(1.05);
        }
        
        .chip-genre {
            background: linear-gradient(135deg, #f8bbd9, #fce4ec);
            color: #c2185b;
            border: 1px solid #f48fb1;
        }
        
        .chip-score {
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            font-weight: 600;
        }
        
        /* Best New Badge */
        .best-new-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        
        /* Alerts */
        .alert {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem 0;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .alert-error {
            border-left: 4px solid #f44336;
            color: #c62828;
        }
        
        .alert-info {
            border-left: 4px solid #2196f3;
            color: #1565c0;
        }
        
        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(233, 30, 99, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 1000;
        }
        
        .fab:hover:not(:disabled) {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 12px 32px rgba(233, 30, 99, 0.5);
        }
        
        .fab:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
            .albums-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
                align-items: center;
            }
            
            .album-details {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            
            .fab {
                bottom: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect } = React;

        function AlbumCard({ album }) {
            return (
                <div className="album-card">
                    {album.best_new && (
                        <div className="best-new-badge">Best New</div>
                    )}
                    <div className="album-title">{album.title}</div>
                    <div className="album-artist">{album.artist}</div>
                    <div className="album-details">
                        <span className="chip chip-genre">{album.genre}</span>
                        <span className="chip chip-score">{album.score}</span>
                    </div>
                </div>
            );
        }

        function App() {
            const [albums, setAlbums] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const loadAlbums = async () => {
                try {
                    setLoading(true);
                    setError(null);
                    
                    const response = await fetch('/api/albums');
                    if (!response.ok) throw new Error('Failed to fetch albums');
                    
                    const data = await response.json();
                    setAlbums(data);
                } catch (err) {
                    console.error('Error loading albums:', err);
                    setError('Error loading albums. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadAlbums();
            }, []);

            const totalAlbums = albums.length;
            const bestNewCount = albums.filter(album => album.best_new).length;

            return (
                <div className="app">
                    <div className="header">
                        <h1>🎵 Pitchfork High-Scoring Albums</h1>
                        <p>Discover the latest albums rated 8.0+ by Pitchfork</p>
                    </div>

                    <div className="container">
                        {!loading && (
                            <div className="stats">
                                <div className="stat-card">
                                    <div className="stat-number">{totalAlbums}</div>
                                    <div className="stat-label">High-Scoring Albums</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{bestNewCount}</div>
                                    <div className="stat-label">"Best New" Selections</div>
                                </div>
                            </div>
                        )}

                        <div className="controls">
                            <button 
                                className="refresh-btn" 
                                onClick={loadAlbums}
                                disabled={loading}
                            >
                                {loading ? (
                                    <>
                                        <div className="spinner" style={{width: '20px', height: '20px', margin: 0}}></div>
                                        Loading...
                                    </>
                                ) : (
                                    <>
                                        🔄 Refresh Data
                                    </>
                                )}
                            </button>
                        </div>

                        {error && (
                            <div className="alert alert-error">
                                {error}
                            </div>
                        )}

                        {loading && (
                            <div className="loading">
                                <div className="spinner"></div>
                                <div>Loading albums...</div>
                            </div>
                        )}

                        {!loading && albums.length > 0 && (
                            <div className="albums-grid">
                                {albums.map((album, index) => (
                                    <AlbumCard key={index} album={album} />
                                ))}
                            </div>
                        )}

                        {!loading && albums.length === 0 && !error && (
                            <div className="alert alert-info">
                                No albums found. Please try refreshing.
                            </div>
                        )}
                    </div>

                    <button 
                        className="fab" 
                        onClick={loadAlbums}
                        disabled={loading}
                        title="Refresh"
                    >
                        🔄
                    </button>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        {% endraw %}
    </script>
</body>
</html>
